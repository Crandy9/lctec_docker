services:
  django-backend-prod-lctec:
    image: lctec/lctec-backend:${IMAGE_TAG}
    container_name: django-backend-prod-lctec
    env_file:
      - ".env"
    volumes:
      - "./backend:/backend"
      - "./backend/staticfiles:/backend/staticfiles"   
      - "./backend/backend_logger:/backend/backend_logger"       
    # for DBs command: ["sh", "-c", "python manage.py collectstatic --noinput && python manage.py makemigrations && python manage.py migrate gunicorn --bind 0.0.0.0:8000 lctec_project.wsgi:application"]      
    command: ["sh", "-c", "python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 lctec_project.wsgi:application"]      
    networks:
      - backend_network_lctec

  nginx-prod-lctec:
    image: lctec/lctec-frontend:${IMAGE_TAG}
    container_name: nginx-prod-lctec
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"    
    volumes:
      - ./nginx/prod-nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
      - ./backend/staticfiles:/backend/staticfiles
      - /var/www/sites/webp-converter/webp-converter/frontend/dist:/frontend-webp/dist
      - /var/www/sites/webp-converter/webp-converter/backend/staticfiles:/backend-webp/staticfiles
      - /var/www/sites/webp-converter/webp-converter/backend/media:/backend-webp/media
    depends_on:
      - django-backend-prod-lctec
      - certbot
    networks:
      - backend_network_lctec
      - shared-proxy

  certbot:
    image: certbot/certbot:latest
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    # command: certonly --webroot -w /var/www/certbot --keep-until-expiring --email ${DOCKER_CERTBOT_EMAIL} -d ${DOCKER_CERTBOT_DOMAIN_1} -d ${DOCKER_CERTBOT_DOMAIN_2} --agree-tos --dry-run
    command: certonly --webroot -w /var/www/certbot --keep-until-expiring --email ${DOCKER_CERTBOT_EMAIL} -d ${DOCKER_CERTBOT_DOMAIN_1} -d ${DOCKER_CERTBOT_DOMAIN_2} --agree-tos


networks:
  backend_network_lctec:
    driver: bridge
  shared-proxy:
    name: shared-proxy
    driver: bridge    

volumes:
  node_modules: